<!DOCTYPE html>

<head>

    <title>Contact</title>
    <link rel="stylesheet" href="css/ligne.css">

<body>

    <h1>Contactez-nous si vous rencontrez un problème et nous vous répondrons dans les meilleurs délais.</h1>

    <p>Pour toute question, vous pouvez nous envoyer un message ici svp:</p>

    <form action="#" method="post">
        <div>
            <label for="nom">Nom :</label><br>
            <input type="text" id="nom" name="nom" required>
        </div>
        <br>
        <div>
            <label for="email">E-mail :</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <br>
        <div>
            <label for="message">Message :</label><br>
            <textarea id="message" name="message" rows="4" required></textarea>
        </div>
        <br>
        <button type="submit">Envoyer</button>
    </form>
